<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoli Nusantara</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Landing Screen -->
    <div id="landing-screen" class="screen active">
        <div class="container">
            <h1 class="logo">🏝️ Monopoli<br><span>Nusantara</span></h1>
            <div class="edition-badge">✨ 3D Realistic HD Edition</div>
            <p class="tagline">Jelajahi Indonesia, Kuasai Nusantara!</p>

            <div class="form-group">
                <label>Nama Pemain</label>
                <input type="text" id="player-name" maxlength="15" placeholder="Masukkan nama..." autocomplete="off">
            </div>

            <div class="form-group">
                <label>Pilih Pion</label>
                <div class="token-grid">
                    <div class="token-card" data-token="becak" onclick="selectToken(this)">
                        <span class="token-icon">🚲</span>
                        <span class="token-name">Becak</span>
                    </div>
                    <div class="token-card" data-token="pinisi" onclick="selectToken(this)">
                        <span class="token-icon">⛵</span>
                        <span class="token-name">Pinisi</span>
                    </div>
                    <div class="token-card" data-token="bajaj" onclick="selectToken(this)">
                        <span class="token-icon">🛺</span>
                        <span class="token-name">Bajaj</span>
                    </div>
                    <div class="token-card" data-token="komodo" onclick="selectToken(this)">
                        <span class="token-icon">🦎</span>
                        <span class="token-name">Komodo</span>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="createRoom()">🎮 Buat Room</button>
                <button class="btn btn-secondary" onclick="showJoinInput()">🔗 Gabung Room</button>
            </div>

            <div id="join-section" class="join-section hidden">
                <div class="form-group">
                    <label>Kode Room</label>
                    <input type="text" id="room-code" maxlength="7" placeholder="NUS-XXX" style="text-transform: uppercase" autocomplete="off">
                </div>
                <button class="btn btn-primary" onclick="joinRoom()">Gabung!</button>
            </div>

            <div id="error-msg" class="error-msg hidden"></div>
        </div>
    </div>

    <!-- Lobby Screen -->
    <div id="lobby-screen" class="screen">
        <div class="container">
            <h2>Room Lobby</h2>
            <div class="room-code-display" onclick="copyRoomCode()">
                <span id="lobby-room-code">NUS-XXX</span>
                <span class="copy-hint">📋 Klik untuk salin</span>
            </div>

            <div class="players-list" id="players-list">
                <!-- Populated by JS -->
            </div>

            <div id="host-controls" class="host-controls hidden">
                <button class="btn btn-secondary" id="add-bot-btn" onclick="addBot()">🤖 Tambah Bot</button>
                <button class="btn btn-primary btn-large" id="start-btn" onclick="startGame()" disabled>🎲 Mulai Game!</button>
            </div>

            <div class="lobby-chat" id="lobby-chat">
                <!-- Chat messages -->
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="js/lobby.js"></script>
</body>
</html>
